<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <title>CobaltOS boot splash logo</title>
  <defs>
    <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.55" stop-color="#0047AB"/>
      <stop offset="1" stop-color="#002A6B"/>
    </linearGradient>
  </defs>
  <!-- logo (same artwork as cobaltos.svg, scaled to 180px) -->
  <g transform="translate(0 10) scale(0.703)">
    <polygon points="128,20 222,74 222,182 128,236 34,182 34,74"
             fill="url(#cobalt)" stroke="url(#cobalt)" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="128,20 34,74 128,128" fill="#FFFFFF" opacity="0.16"/>
    <polygon points="128,20 222,74 128,128" fill="#FFFFFF" opacity="0.07"/>
    <polygon points="34,182 128,236 128,128" fill="#000000" opacity="0.10"/>
    <polygon points="222,182 128,236 128,128" fill="#000000" opacity="0.18"/>
    <path d="M169 87 A58 58 0 1 0 169 169" fill="none" stroke="#FFFFFF" stroke-width="26"/>
    <rect x="174" y="116" width="24" height="24" fill="#7FD4FF"/>
  </g>
  <!-- wordmark -->
  <text x="205" y="136" font-family="Noto Sans, Cantarell, DejaVu Sans, sans-serif"
        font-size="108" font-weight="700" letter-spacing="-2">
    <tspan fill="#FFFFFF">Cobalt</tspan><tspan fill="#7FD4FF">OS</tspan>
  </text>
</svg>
