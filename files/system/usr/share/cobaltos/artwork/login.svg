<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <title>CobaltOS login</title>
  <!-- Login screen background: the default wallpaper with the CobaltOS name in
       the top-left corner, away from the clock and password box in the middle.
       The two images are files next to this one (rendered by rsvg-convert). -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020611" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#020611" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image href="wallpaper.svg" xlink:href="wallpaper.svg" width="3840" height="2160"/>
  <rect width="3840" height="2160" fill="url(#shade)"/>
  <image href="splash-logo.svg" xlink:href="splash-logo.svg" x="150" y="130" width="608" height="160"/>
  <text x="314" y="352" font-family="Noto Sans, Cantarell, DejaVu Sans, sans-serif" font-size="44"
        font-weight="500" fill="#B8C6E6">Your old PC games, on modern hardware.</text>
</svg>
