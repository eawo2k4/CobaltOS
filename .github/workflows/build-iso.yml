name: build-iso
# Builds offline installer ISOs for each CobaltOS edition from the published
# images, using bootc-image-builder's Anaconda ISO (the normal Fedora
# graphical installer: pick a disk, create your user, done).
#
# Run it from the Actions tab -> build-iso -> "Run workflow".
# The ISOs show up as downloadable artifacts on the run's summary page.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-iso.yml # rebuild when the ISO setup changes
      - iso/**

concurrency:
  group: build-iso
  cancel-in-progress: true

env:
  # Must match image-version in recipes/*.yml. The installer environment is
  # built from plain Fedora packages; CobaltOS itself comes from the image.
  FEDORA_VERSION: "45"

jobs:
  iso:
    name: Build ISO (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - cobaltos # KDE, AMD/Intel
          - cobaltos-nvidia # KDE, NVIDIA
    steps:
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Pull the CobaltOS image
        run: sudo podman pull ghcr.io/eawo2k4/${{ matrix.image }}:latest

      - name: Make the installer build container
        run: |
          sudo podman build --build-arg FEDORA_VERSION=${{ env.FEDORA_VERSION }} \
            -t localhost/cobalt-iso-builder:latest -f iso/Containerfile iso

      - name: Build the installer ISO
        run: |
          mkdir -p output
          set -o pipefail
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --build-container localhost/cobalt-iso-builder:latest \
            ghcr.io/eawo2k4/${{ matrix.image }}:latest 2>&1 | tee build.log

      - name: Show the error summary
        if: failure()
        run: |
          # Annotations are visible without signing in, unlike full logs.
          msg=$(tail -n 25 build.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-300)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=ISO build failed (${{ matrix.image }})::${msg}"

      - name: Name and checksum the ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          iso=$(find output -name '*.iso' | head -1)
          test -n "$iso"
          mv "$iso" "${{ matrix.image }}.iso"
          sha256sum "${{ matrix.image }}.iso" > "${{ matrix.image }}.iso.sha256"
          ls -lh "${{ matrix.image }}".iso*

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-iso
          path: |
            ${{ matrix.image }}.iso
            ${{ matrix.image }}.iso.sha256
          compression-level: 0 # ISOs are already compressed
          retention-days: 30
