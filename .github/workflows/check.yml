name: check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  welcome-app:
    name: Welcome Center smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install PyQt6
        run: pip install PyQt6

      - name: Check syntax
        run: python -m py_compile files/system/usr/bin/cobalt-welcome

      - name: Open every page headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 python files/system/usr/bin/cobalt-welcome --smoke-test

      - name: Check desktop files
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate files/system/usr/share/applications/cobalt-welcome.desktop
          desktop-file-validate files/system/etc/xdg/autostart/cobalt-welcome.desktop

  branding:
    name: Branding checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check shell scripts
        run: |
          bash -n files/scripts/cobalt-setup.sh
          bash -n files/scripts/cobalt-branding.sh

      - name: Check config helpers
        run: |
          set -e
          python -m py_compile files/system/usr/libexec/cobaltos/kconf-set files/system/usr/libexec/cobaltos/make-colorscheme
          K=files/system/usr/libexec/cobaltos/kconf-set
          printf '[General]\nfont=Noto Sans\n\n[KDE]\nLookAndFeelPackage=org.kde.breeze.desktop\n' > /tmp/kdeglobals
          python $K /tmp/kdeglobals KDE LookAndFeelPackage org.cobaltos.desktop
          python $K /tmp/kdeglobals General ColorScheme CobaltOS
          python $K /tmp/kdeglobals "ksplashrc][KSplash" Theme org.cobaltos.desktop
          cat /tmp/kdeglobals
          grep -qx 'LookAndFeelPackage=org.cobaltos.desktop' /tmp/kdeglobals
          grep -qx 'font=Noto Sans' /tmp/kdeglobals
          grep -qx 'ColorScheme=CobaltOS' /tmp/kdeglobals
          grep -qx '\[ksplashrc\]\[KSplash\]' /tmp/kdeglobals
          [ "$(grep -c LookAndFeelPackage /tmp/kdeglobals)" = 1 ]

      - name: Build the colour scheme from Breeze Dark
        run: |
          set -e
          curl -fsSL -o /tmp/BreezeDark.colors https://invent.kde.org/plasma/breeze/-/raw/master/colors/BreezeDark.colors
          python files/system/usr/libexec/cobaltos/make-colorscheme /tmp/BreezeDark.colors /tmp/CobaltOS.colors
          cat /tmp/CobaltOS.colors
          grep -qx 'Name=CobaltOS' /tmp/CobaltOS.colors
          grep -q '^\[Colors:Window\]' /tmp/CobaltOS.colors

      - name: Check JSON files
        run: python -m json.tool files/system/etc/xdg/fastfetch/config.jsonc > /dev/null

      - name: Render the wallpapers
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p /tmp/walls
          A=files/system/usr/share/cobaltos/artwork
          for svg in $A/wallpaper.svg $A/wallpapers/*.svg; do
            grep -q '<title>.*</title>' "$svg" || { echo "::error file=$svg::wallpaper has no <title> (used as its name)"; exit 1; }
            rsvg-convert -w 1920 -h 1080 -o "/tmp/walls/$(basename "$svg" .svg).png" "$svg"
          done
          ls -l /tmp/walls

      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-previews
          path: /tmp/walls/
          retention-days: 7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Load the login splash QML
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install PyQt6
          python - <<'PY'
          import sys
          from PyQt6.QtCore import QUrl
          from PyQt6.QtGui import QGuiApplication
          from PyQt6.QtQml import QQmlComponent, QQmlEngine
          app = QGuiApplication(sys.argv)
          engine = QQmlEngine()
          comp = QQmlComponent(engine, QUrl.fromLocalFile("files/system/usr/share/cobaltos/splash/Splash.qml"))
          obj = comp.create()
          if comp.isError() or obj is None:
              for e in comp.errors():
                  print(e.toString())
              sys.exit(1)
          obj.setProperty("stage", 6)
          print("Splash.qml loaded OK")
          PY
